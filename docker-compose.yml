version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.12.0-community
    container_name: rag_neo4j
    ports:
      - "7474:7474" # Web UI (Vào bằng trình duyệt)
      - "7687:7687" # Bolt Protocol (Code Python kết nối qua cổng này)
    environment:
      - NEO4J_AUTH=neo4j/password123456  # Hãy đổi mật khẩu này trong file .env sau
    volumes:
      - neo4j_data:/data

volumes:
  qdrant_data:
  neo4j_data: