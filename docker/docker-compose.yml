services:
  backend:

    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag_backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2500M
        reservations:
          memory: 1500M
