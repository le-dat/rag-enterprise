[project]
name = "rag-enterprise"
version = "0.1.0"
description = "Enterprise RAG Solution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cohere>=5.5.0",
    "fastapi>=0.111.0",
    "fastembed>=0.3.0",
    "groq>=0.9.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.2.0",
    "llama-index>=0.10.0",
    "llama-parse>=0.4.0",
    "openai>=1.30.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "qdrant-client>=1.9.0",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
